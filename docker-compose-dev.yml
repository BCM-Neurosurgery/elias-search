version: '3.8'

services:
  client:
    build:
      context: ./elias-search-web
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_WEBSOCKET_URL: ${WEBSOCKET_URL}
    depends_on:
      - server
  server:
    build: 
      context: ./elias-search-server
    ports:
      - "8081:8081"
    environment:
      DJ_USER: ${DJ_USER}
      DJ_PASSWORD: ${DJ_PASSWORD}
      DJ_HOST: ${DJ_HOST}
      DJ_PORT: ${DJ_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      LOGGING_PATH: /var/lib/elias-search/dj_log.log
    volumes:
      - ${DATALAKE_PATH}:/mnt/datalake/data/emu:ro
      - ${STITCHED_PATH}:/mnt/stitched/EMU-18112:ro
      - elias_dev_logs:/var/lib/elias-search
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8081"
  nginx:
    image: nginx:alpine
    ports:
      - "8444:8444"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - client
      - server
  watchdog:
    build:
      context: ./watchdog
    container_name: watchdog
    depends_on:
      - server
    environment:
      TARGET_URL: 'http://server:8081/ping/'
      CHECK_INTERVAL: '60'
    volumes:
      - ./docker-compose-dev.yml:/app/docker-compose.yml
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  elias_dev_logs:
