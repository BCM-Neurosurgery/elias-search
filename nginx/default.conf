server {
    listen 80;
    server_name elias.bcms.bcm.edu;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name elias.bcms.bcm.edu;

    ssl_certificate /etc/nginx/ssl/healthchecks.crt;
    ssl_certificate_key /etc/nginx/ssl/healthchecks.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://client:3000/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://server:8080/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;        # time Nginx waits for response from Django
        proxy_connect_timeout 600s;     # time Nginx waits to connect
        proxy_send_timeout 600s;        # time Nginx waits to send request to Django
    }

     location /ws/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
