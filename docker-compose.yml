version: '3.8'

services:
  client:
    build:
      context: ./elias-search-client
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./elias-search-client:/app
      - /app/node_modules # prevent host module overrides
    environment:
      VITE_BACKEND_URL: https://elias.bcms.bcm.edu/api
    depends_on:
      - server
  server:
    build: 
      context: ./elias-search-server
    ports:
      - "8080:8080"
    environment:
      DJ_USER: ${DJ_USER}
      DJ_PASSWORD: ${DJ_PASSWORD}
      DJ_HOST: ${DJ_HOST}
      DJ_PORT: ${DJ_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - ./elias-search-server:/app
      - ${DATALAKE_PATH}:/mnt/datalake/data/emu:ro
      - ${STITCHED_PATH}:/mnt/stitched/EMU-18112:ro
      - ./elias-search-server/dj_log.log:/mnt/lake-database/stitched-logs/datajoint_computed_table.log
    command: >
      sh -c "python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8080"
  nginx:
    image: nginx:alpine
    ports:
      - "8443:443"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - client
      - server
  


