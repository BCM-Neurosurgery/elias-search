version: '3.8'

services:
  client:
    build:
      context: ./elias-search-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_WEBSOCKET_URL: ${WEBSOCKET_URL}
    depends_on:
      - server
    restart: unless-stopped
  server:
    build: 
      context: ./elias-search-server
    ports:
      - "8080:8080"
    environment:
      DJ_USER: ${DJ_USER}
      DJ_PASSWORD: ${DJ_PASSWORD}
      DJ_HOST: ${DJ_HOST}
      DJ_PORT: ${DJ_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - ${DATALAKE_PATH}:/mnt/datalake/data/emu:ro
      - ${STITCHED_PATH}:/mnt/stitched/EMU-18112:ro
      - ./elias-search-server/dj_log.log:/mnt/lake-database/stitched-logs/datajoint_computed_table.log
    command: >
      sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8080 es_server.asgi:application"
    restart: unless-stopped
  watchdog:
    build:
      context: ./watchdog
    container_name: watchdog
    depends_on:
      - server
    environment:
      TARGET_URL: 'http://server:8080/ping/'
      CHECK_INTERVAL: '60'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
  


