version: '3.8'

services:
  client:
    build:
      context: ./elias-search-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_WEBSOCKET_URL: ${WEBSOCKET_URL}
    depends_on:
      - server
    restart: unless-stopped
  server:
    build: 
      context: ./elias-search-server
    ports:
      - "8080:8080"
    environment:
      DJ_USER: ${DJ_USER}
      DJ_PASSWORD: ${DJ_PASSWORD}
      DJ_HOST: ${DJ_HOST}
      DJ_PORT: ${DJ_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - ${DATALAKE_PATH}:/mnt/datalake/data/emu:ro
      - ${STITCHED_PATH}:/mnt/stitched/EMU-18112:ro
      - type: bind
        source: ./elias-search-server/dj_log.log
        target: /mnt/lake-database/stitched-logs/datajoint_computed_table.log
        bind:
          create_host_path: false
      - type: bind
        source: ./elias-search-server/db.sqlite3
        target: /app/db.sqlite3
        bind:
          create_host_path: false
    command: >
      sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8080 es_server.asgi:application"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  


